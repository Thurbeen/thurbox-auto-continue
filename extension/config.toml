# thurbox-auto-continue settings. Every key below is commented out, so each
# takes its default. Change one with
#   thurbox-auto-continue config set <key> <value>
# or for one session only (enabled, message, delay_secs)
#   thurbox-auto-continue config set <key> <value> --session <ref>
# This file is read again on every run.

# The global default. A session's own setting wins in both directions.
# enabled = false
# Seconds after the quota window resets before the message is typed (0-86400).
# delay_secs = 300
# What is typed: one line, not starting with / or !.
# message = "continue"
# Quota windows acted on. Add "seven_day" to act on the weekly window too.
# windows = ["five_hour"]
# Sends allowed for one run of re-rejections before giving up.
# max_attempts = 2
# Claude's usage-limit menu open at send time: "escape" closes it once, "skip" leaves it.
# on_menu = "escape"
# Seconds to wait for the session to report `working` after Enter (at most 20).
# confirm_secs = 20
