[package]
name = "thurbox-auto-continue"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Headless, LLM-free auto-continue for Claude sessions in Thurbox"
license = "MIT"
repository = "https://github.com/Thurbeen/thurbox-auto-continue"
readme = "README.md"
keywords = ["thurbox", "claude", "tmux", "cli"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
lto = true
